# Le job : bronze et silver en PySpark, gold en dbt, puis le tableau de bord rafraîchi et envoyé en PDF.
# Il démarre dès qu'un fichier mensuel d'Infrabel arrive dans le volume, et prévient par mail en cas d'échec.
resources:
  jobs:
    ponctualite_trains_belges:
      name: ponctualite_trains_belges
      description: Charge un fichier mensuel d'Infrabel, construit le schéma en étoile avec dbt et rafraîchit le tableau de bord.

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/bronze/fichiers/
          wait_after_last_change_seconds: 120

      queue:
        enabled: true

      # Calcul serverless en mode standard : pour un traitement mensuel, quelques minutes de démarrage ne comptent pas.
      performance_target: STANDARD

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_bronze.py
            base_parameters:
              catalogue: ${var.catalog}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/03_silver.py
            base_parameters:
              catalogue: ${var.catalog}

        # Le gold : dbt construit les dimensions, le fait et les vues dans <catalogue>.gold, puis lance les tests
        # de données. Un test en échec arrête le job avant le tableau de bord. Les tests unitaires tournent dans
        # GitHub Actions, pas ici.
        - task_key: gold_dbt
          depends_on:
            - task_key: silver
          environment_key: dbt
          dbt_task:
            project_directory: ../dbt
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: gold
            commands:
              - dbt build --exclude-resource-type unit_test

        - task_key: tableau_de_bord
          depends_on:
            - task_key: gold_dbt
          dashboard_task:
            dashboard_id: ${resources.dashboards.tableau_de_bord.id}
            warehouse_id: ${var.warehouse_id}
            subscription:
              subscribers:
                - user_name: ${workspace.current_user.userName}

      environments:
        - environment_key: dbt
          spec:
            environment_version: "5"
            dependencies:
              - dbt-databricks>=1.11.0,<2.0.0
